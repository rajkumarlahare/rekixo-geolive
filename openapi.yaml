openapi: 3.1.0
info:
  title: Rekixo GeoLive API
  version: 0.5.0
  description: Project-scoped live-location API with account-scoped admin and database-backed API-key lifecycle.
servers:
  - url: https://geolive.example.com

paths:
  /health:
    get:
      operationId: health
      responses:
        "200": { description: Service health }

  /ready:
    get:
      operationId: ready
      responses:
        "200": { description: Service and persistence ready }
        "503": { description: Required persistence/control-plane component is unavailable }

  /v1/locations:
    post:
      operationId: ingestLocation
      security:
        - integrationBearer: []
      parameters:
        - $ref: "#/components/parameters/PackageHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationObservation"
      responses:
        "202": { description: Accepted }
        "400": { description: Invalid input }
        "401": { description: Missing, invalid, expired or revoked key }
        "403": { description: Scope, project, origin or package restriction denied }

  /v1/users:
    get:
      operationId: listUsers
      security:
        - integrationBearer: []
      parameters:
        - $ref: "#/components/parameters/PackageHeader"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200": { description: Cursor-paginated project-scoped latest users }
        "429": { description: Project read rate limit exceeded }

  /v1/summary:
    get:
      operationId: summary
      security:
        - integrationBearer: []
      parameters:
        - $ref: "#/components/parameters/PackageHeader"
      responses:
        "200": { description: Project-scoped status totals }

  /v1/events:
    get:
      operationId: realtimeEvents
      security:
        - integrationBearer: []
      parameters:
        - $ref: "#/components/parameters/PackageHeader"
      responses:
        "200": { description: Project-scoped Server-Sent Events stream }

  /v1/admin/login:
    post:
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 256 }
      responses:
        "200": { description: Sets HttpOnly session cookie and returns CSRF token }
        "401": { description: Invalid credentials }
        "429": { description: Login temporarily locked }

  /v1/admin/me:
    get:
      operationId: adminMe
      security:
        - adminCookie: []
      responses:
        "200": { description: Current admin, accounts, projects and refreshed CSRF token }
        "401": { description: Admin session required }

  /v1/admin/logout:
    post:
      operationId: adminLogout
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { description: Session revoked }

  /v1/admin/projects:
    get:
      operationId: adminListProjects
      security:
        - adminCookie: []
      responses:
        "200": { description: Projects visible through account membership }
    post:
      operationId: adminCreateProject
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, name, slug]
              additionalProperties: false
              properties:
                accountId: { type: string, format: uuid }
                name: { type: string, minLength: 2, maxLength: 120 }
                slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
      responses:
        "201": { description: Project created }
        "403": { description: Owner/admin role required }

  /v1/admin/projects/{projectId}:
    patch:
      operationId: adminUpdateProject
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
                status: { type: string, enum: [active, suspended] }
      responses:
        "200": { description: Project updated }
        "403": { description: Owner/admin role required }
        "404": { description: Project unavailable }
    delete:
      operationId: adminDeleteProject
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { description: Project soft-deleted }

  /v1/admin/projects/{projectId}/users:
    get:
      operationId: adminProjectUsers
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Latest users for an authorized project }

  /v1/admin/projects/{projectId}/summary:
    get:
      operationId: adminProjectSummary
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Status totals for an authorized project }

  /v1/admin/projects/{projectId}/keys:
    get:
      operationId: adminListApiKeys
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: API-key metadata only; never returns secret hashes or full secrets
    post:
      operationId: adminCreateApiKey
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKey"
      responses:
        "201":
          description: Key created; full secret is returned once
        "403": { description: Owner/admin role required }

  /v1/admin/projects/{projectId}/keys/{keyId}:
    patch:
      operationId: adminUpdateApiKey
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                allowedOrigins:
                  type: array
                  maxItems: 50
                  items: { type: string, format: uri }
                allowedPackages:
                  type: array
                  maxItems: 50
                  items: { type: string }
                expiresAt:
                  oneOf:
                    - { type: string, format: date-time }
                    - { type: "null" }
      responses:
        "200": { description: Key metadata updated }

  /v1/admin/projects/{projectId}/keys/{keyId}/rotate:
    post:
      operationId: adminRotateApiKey
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "201":
          description: Replacement key created and old key atomically revoked; new secret returned once

  /v1/admin/projects/{projectId}/keys/{keyId}/revoke:
    post:
      operationId: adminRevokeApiKey
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { description: Key revoked }

  /v1/admin/projects/{projectId}/operations/limits:
    get:
      operationId: adminGetProjectLimits
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Project rate limits, quotas and retention settings }
    patch:
      operationId: adminUpdateProjectLimits
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectLimitsPatch"
      responses:
        "200": { description: Project limits updated }
        "403": { description: Owner/admin role required }

  /v1/admin/projects/{projectId}/operations/metrics:
    get:
      operationId: adminProjectMetrics
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - in: query
          name: hours
          schema: { type: integer, minimum: 1, maximum: 744, default: 24 }
      responses:
        "200": { description: Aggregated operational metrics and daily usage }

  /v1/admin/projects/{projectId}/operations/security-events:
    get:
      operationId: adminProjectSecurityEvents
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200": { description: Cursor-paginated project security events }

components:
  securitySchemes:
    integrationBearer:
      type: http
      scheme: bearer
      description: Database-backed rgl_live_ integration credential.
    adminCookie:
      type: apiKey
      in: cookie
      name: geolive_admin_session

  parameters:
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    KeyId:
      in: path
      name: keyId
      required: true
      schema: { type: string, format: uuid }
    CsrfHeader:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
    PackageHeader:
      in: header
      name: X-GeoLive-Package
      required: false
      description: Required when the integration key defines allowed package IDs. Defense-in-depth until attestation.
      schema: { type: string }

  schemas:
    ProjectLimitsPatch:
      type: object
      additionalProperties: false
      properties:
        ingestRequestsPerMinute: { type: integer, minimum: 1, maximum: 1000000 }
        readRequestsPerMinute: { type: integer, minimum: 1, maximum: 1000000 }
        dailyIngestQuota: { type: integer, minimum: 1, maximum: 1000000000 }
        maxLiveUsers: { type: integer, minimum: 1, maximum: 10000000 }
        historyRetentionDays: { type: integer, minimum: 1, maximum: 3650 }
        securityEventRetentionDays: { type: integer, minimum: 7, maximum: 3650 }
        metricsRetentionDays: { type: integer, minimum: 7, maximum: 3650 }

    CreateApiKey:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [location:write, users:read, summary:read, events:read]
        allowedOrigins:
          type: array
          maxItems: 50
          items: { type: string, format: uri }
        allowedPackages:
          type: array
          maxItems: 50
          items: { type: string }
        expiresAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }

    LocationObservation:
      type: object
      required: [userId, latitude, longitude]
      additionalProperties: false
      properties:
        userId: { type: string, maxLength: 160 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: number, minimum: 0 }
        altitudeM: { type: number }
        headingDeg: { type: number, minimum: 0, maximum: 360 }
        speedMps: { type: number, minimum: 0 }
        capturedAt: { type: string, format: date-time }
        name: { type: string }
        email: { type: string }
        country: { type: string }
        state: { type: string }
        city: { type: string }
        device: { type: object }
        metadata: { type: object }
