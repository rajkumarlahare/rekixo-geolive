openapi: 3.1.0
info:
  title: Rekixo GeoLive API
  version: 0.9.0
  description: Project-scoped live-location API with short-lived client security, commercial plans, movement history, historical heatmaps, usage metering, invoices, support workflows and platform administration.
servers:
  - url: https://geolive.example.com

paths:
  /health:
    get:
      operationId: health
      responses:
        "200": { description: Service health }

  /ready:
    get:
      operationId: ready
      responses:
        "200": { description: Service and persistence ready }
        "503": { description: Required persistence/control-plane component is unavailable }

  /v1/locations:
    post:
      operationId: ingestLocation
      security:
        - integrationBearer: []
      parameters:
        - $ref: "#/components/parameters/PackageHeader"
        - $ref: "#/components/parameters/RequestTimestampHeader"
        - $ref: "#/components/parameters/RequestNonceHeader"
        - $ref: "#/components/parameters/RequestSignatureHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationObservation"
      responses:
        "202": { description: Accepted }
        "400": { description: Invalid input }
        "401": { description: Missing, invalid, expired or revoked key }
        "403": { description: Scope, project, origin or package restriction denied }

  /v1/client-tokens/exchange:
    post:
      operationId: exchangeClientToken
      description: |
        Trusted backend exchanges a database-backed tokens:issue key for a
        short-lived, project/user-bound location:write client token.
        Android requests may include a Google Play Integrity standard token.
      security:
        - integrationBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientTokenExchange"
      responses:
        "201": { description: Short-lived client token issued }
        "400": { description: Invalid exchange, proof key or attestation input }
        "401": { description: Invalid/expired issuer credential or stale exchange }
        "403": { description: Package, origin or attestation policy denied }
        "409": { description: Exchange nonce replayed }
        "429": { description: Token exchange rate limited }
        "503": { description: Client-token signing or attestation service unavailable }

  /v1/users:
    get:
      operationId: listUsers
      security:
        - integrationBearer: []
      parameters:
        - $ref: "#/components/parameters/PackageHeader"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200": { description: Cursor-paginated project-scoped latest users }
        "429": { description: Project read rate limit exceeded }

  /v1/history:
    get:
      operationId: movementHistory
      description: |
        Cursor-paginated project/user movement history. Requires history:read.
        The requested time window must be no more than 31 days and returned
        data is bounded by the project's configured history retention.
      security:
        - integrationBearer: []
      parameters:
        - $ref: "#/components/parameters/PackageHeader"
        - in: query
          name: userId
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 250 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 1024 }
      responses:
        "200": { description: Project/user-scoped historical location points and next cursor }
        "400": { description: Invalid user, cursor or history window }
        "402": { description: Movement-history feature not entitled }
        "429": { description: Project read rate limit exceeded }

  /v1/heatmap:
    get:
      operationId: historicalHeatmap
      description: |
        Aggregates retained project location history into geographic cells.
        Requires history:read and a maximum 31-day query window.
      security:
        - integrationBearer: []
      parameters:
        - $ref: "#/components/parameters/PackageHeader"
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: gridDegrees
          schema: { type: number, minimum: 0.25, maximum: 45, default: 2 }
        - in: query
          name: userId
          required: false
          schema: { type: string, minLength: 1, maxLength: 160 }
      responses:
        "200": { description: Project-scoped historical heatmap cells }
        "400": { description: Invalid grid or history window }
        "402": { description: Heatmap feature not entitled }
        "429": { description: Project read rate limit exceeded }

  /v1/clusters:
    get:
      operationId: listClusters
      description: Project-scoped server-side geographic marker aggregation for large live maps.
      security:
        - integrationBearer: []
      parameters:
        - $ref: "#/components/parameters/PackageHeader"
        - in: query
          name: gridDegrees
          schema: { type: number, minimum: 0.25, maximum: 45, default: 8 }
        - in: query
          name: status
          schema: { type: string, enum: [online, recent, offline, inactive] }
        - in: query
          name: country
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
      responses:
        "200": { description: Aggregate cluster centers and activity counts }
        "429": { description: Project read rate limit exceeded }

  /v1/summary:
    get:
      operationId: summary
      security:
        - integrationBearer: []
      parameters:
        - $ref: "#/components/parameters/PackageHeader"
      responses:
        "200": { description: Project-scoped status totals }

  /v1/events:
    get:
      operationId: realtimeEvents
      security:
        - integrationBearer: []
      parameters:
        - $ref: "#/components/parameters/PackageHeader"
      responses:
        "200": { description: Project-scoped Server-Sent Events stream }

  /v1/realtime:
    get:
      operationId: integrationRealtimeWebSocket
      description: |
        WebSocket upgrade endpoint. After upgrade, send an authenticate JSON message
        containing a read key with events:read and optional resumeAfter sequence.
        API keys are intentionally not accepted in the URL.
      responses:
        "101": { description: WebSocket protocol switched }
        "400": { description: Invalid WebSocket upgrade }
        "503": { description: Realtime unavailable }

  /v1/admin/login:
    post:
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 12, maxLength: 256 }
      responses:
        "200": { description: Sets HttpOnly session cookie and returns CSRF token }
        "401": { description: Invalid credentials }
        "429": { description: Login temporarily locked }

  /v1/admin/me:
    get:
      operationId: adminMe
      security:
        - adminCookie: []
      responses:
        "200": { description: Current admin, accounts, projects and refreshed CSRF token }
        "401": { description: Admin session required }

  /v1/admin/logout:
    post:
      operationId: adminLogout
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { description: Session revoked }

  /v1/admin/projects:
    get:
      operationId: adminListProjects
      security:
        - adminCookie: []
      responses:
        "200": { description: Projects visible through account membership }
    post:
      operationId: adminCreateProject
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, name, slug]
              additionalProperties: false
              properties:
                accountId: { type: string, format: uuid }
                name: { type: string, minLength: 2, maxLength: 120 }
                slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
      responses:
        "201": { description: Project created }
        "403": { description: Owner/admin role required }

  /v1/admin/projects/{projectId}:
    patch:
      operationId: adminUpdateProject
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                slug: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
                status: { type: string, enum: [active, suspended] }
      responses:
        "200": { description: Project updated }
        "403": { description: Owner/admin role required }
        "404": { description: Project unavailable }
    delete:
      operationId: adminDeleteProject
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { description: Project soft-deleted }

  /v1/admin/projects/{projectId}/users:
    get:
      operationId: adminProjectUsers
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Latest users for an authorized project }

  /v1/admin/projects/{projectId}/facets:
    get:
      operationId: adminProjectLocationFacets
      description: Project-scoped country, state and city values for scalable dashboard filtering.
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Bounded location facet values for the authorized project }

  /v1/admin/projects/{projectId}/history:
    get:
      operationId: adminProjectMovementHistory
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - in: query
          name: userId
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 250 }
        - in: query
          name: cursor
          schema: { type: string, maxLength: 1024 }
      responses:
        "200": { description: Authorized project/user movement history }
        "400": { description: Invalid history query }
        "402": { description: Movement-history feature not entitled }

  /v1/admin/projects/{projectId}/heatmap:
    get:
      operationId: adminProjectHistoricalHeatmap
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: gridDegrees
          schema: { type: number, minimum: 0.25, maximum: 45, default: 2 }
        - in: query
          name: userId
          required: false
          schema: { type: string, minLength: 1, maxLength: 160 }
      responses:
        "200": { description: Authorized project historical heatmap cells }
        "400": { description: Invalid heatmap query }
        "402": { description: Heatmap feature not entitled }

  /v1/admin/projects/{projectId}/summary:
    get:
      operationId: adminProjectSummary
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Status totals plus UTC-day active-user count for an authorized project }

  /v1/admin/projects/{projectId}/clusters:
    get:
      operationId: adminProjectClusters
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - in: query
          name: gridDegrees
          schema: { type: number, minimum: 0.25, maximum: 45, default: 8 }
        - in: query
          name: status
          schema: { type: string, enum: [online, recent, offline, inactive] }
        - in: query
          name: country
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: city
          schema: { type: string }
      responses:
        "200": { description: Aggregate cluster centers for an authorized project }

  /v1/admin/realtime:
    get:
      operationId: adminRealtimeWebSocket
      description: Same-origin admin WebSocket upgrade using the HttpOnly session cookie.
      security:
        - adminCookie: []
      parameters:
        - in: query
          name: projectId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: after
          required: false
          schema: { type: string, pattern: "^[0-9]+$" }
      responses:
        "101": { description: WebSocket protocol switched }
        "401": { description: Admin session required }
        "403": { description: Project access denied }

  /v1/admin/projects/{projectId}/keys:
    get:
      operationId: adminListApiKeys
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: API-key metadata only; never returns secret hashes or full secrets
    post:
      operationId: adminCreateApiKey
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKey"
      responses:
        "201":
          description: Key created; full secret is returned once
        "403": { description: Owner/admin role required }

  /v1/admin/projects/{projectId}/keys/{keyId}:
    patch:
      operationId: adminUpdateApiKey
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                allowedOrigins:
                  type: array
                  maxItems: 50
                  items: { type: string, format: uri }
                allowedPackages:
                  type: array
                  maxItems: 50
                  items: { type: string }
                expiresAt:
                  oneOf:
                    - { type: string, format: date-time }
                    - { type: "null" }
      responses:
        "200": { description: Key metadata updated }

  /v1/admin/projects/{projectId}/keys/{keyId}/rotate:
    post:
      operationId: adminRotateApiKey
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "201":
          description: Replacement key created and old key atomically revoked; new secret returned once

  /v1/admin/projects/{projectId}/keys/{keyId}/revoke:
    post:
      operationId: adminRevokeApiKey
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200": { description: Key revoked }

  /v1/admin/projects/{projectId}/client-security:
    get:
      operationId: adminGetClientSecurity
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Project client-token, proof and Android attestation policy }
    patch:
      operationId: adminUpdateClientSecurity
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientSecurityPolicyPatch"
      responses:
        "200": { description: Client security policy updated }
        "403": { description: Owner/admin role required }

  /v1/admin/projects/{projectId}/operations/limits:
    get:
      operationId: adminGetProjectLimits
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Project rate limits, quotas and retention settings }
    patch:
      operationId: adminUpdateProjectLimits
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectLimitsPatch"
      responses:
        "200": { description: Project limits updated }
        "403": { description: Owner/admin role required }

  /v1/admin/projects/{projectId}/operations/metrics:
    get:
      operationId: adminProjectMetrics
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - in: query
          name: hours
          schema: { type: integer, minimum: 1, maximum: 744, default: 24 }
      responses:
        "200": { description: Aggregated operational metrics and daily usage }

  /v1/admin/projects/{projectId}/operations/security-events:
    get:
      operationId: adminProjectSecurityEvents
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200": { description: Cursor-paginated project security events }


  /v1/admin/accounts/{accountId}/commercial:
    get:
      operationId: adminAccountCommercialOverview
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200": { description: Account subscription, effective entitlements, current usage, invoices and support cases }
        "404": { description: Account not found or inaccessible }

  /v1/admin/accounts/{accountId}/invoices:
    get:
      operationId: adminAccountInvoices
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200": { description: Account invoices }

  /v1/admin/accounts/{accountId}/support-cases:
    get:
      operationId: adminListSupportCases
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200": { description: Account support cases }
    post:
      operationId: adminCreateSupportCase
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportCaseCreate"
      responses:
        "201": { description: Support case created }
        "403": { description: Account write role required }

  /v1/admin/support-cases/{caseId}/messages:
    get:
      operationId: adminSupportCaseMessages
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
      responses:
        "200": { description: Tenant-visible support case messages }
    post:
      operationId: adminAddSupportMessage
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportMessage"
      responses:
        "201": { description: Tenant support message added }

  /v1/platform/overview:
    get:
      operationId: platformOverview
      security:
        - adminCookie: []
      responses:
        "200": { description: Cross-account commercial and support summary }
        "403": { description: Platform role required }

  /v1/platform/plans:
    get:
      operationId: platformListPlans
      security:
        - adminCookie: []
      responses:
        "200": { description: Commercial plan catalog }
    post:
      operationId: platformCreatePlan
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201": { description: Plan created }
        "403": { description: Super-admin role required }

  /v1/platform/plans/{planId}:
    patch:
      operationId: platformUpdatePlan
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "200": { description: Plan updated }
        "403": { description: Super-admin role required }

  /v1/platform/accounts:
    get:
      operationId: platformListAccounts
      security:
        - adminCookie: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200": { description: Accounts with subscription summary }

  /v1/platform/accounts/{accountId}/commercial:
    get:
      operationId: platformAccountCommercial
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200": { description: Cross-account subscription, entitlements, usage, invoices and support summary }
        "403": { description: Platform role required }

  /v1/platform/accounts/{accountId}/subscription:
    patch:
      operationId: platformUpdateSubscription
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPatch"
      responses:
        "200": { description: Subscription updated }
        "403": { description: Billing or super-admin role required }

  /v1/platform/accounts/{accountId}/entitlements:
    patch:
      operationId: platformUpdateEntitlements
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitlementOverrides"
      responses:
        "200": { description: Effective entitlement overrides updated }
        "403": { description: Super-admin role required }

  /v1/platform/accounts/{accountId}/invoices/generate:
    post:
      operationId: platformGenerateInvoice
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceGenerate"
      responses:
        "201": { description: Draft invoice generated from finalized usage }
        "409": { description: Non-void invoice already exists for the period }

  /v1/platform/invoices/{invoiceId}:
    patch:
      operationId: platformUpdateInvoice
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/InvoiceId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoicePatch"
      responses:
        "200": { description: Invoice status updated }

  /v1/platform/support-cases:
    get:
      operationId: platformSupportQueue
      security:
        - adminCookie: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [open, pending_customer, pending_internal, resolved, closed]
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200": { description: Cross-account support queue }

  /v1/platform/support-cases/{caseId}:
    patch:
      operationId: platformUpdateSupportCase
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportCasePatch"
      responses:
        "200": { description: Support case updated }

  /v1/platform/support-cases/{caseId}/messages:
    get:
      operationId: platformSupportCaseMessages
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
      responses:
        "200": { description: Support messages including internal notes }
    post:
      operationId: platformAddSupportMessage
      security:
        - adminCookie: []
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSupportMessage"
      responses:
        "201": { description: Platform support reply or internal note added }

components:
  securitySchemes:
    integrationBearer:
      type: http
      scheme: bearer
      description: Database-backed rgl_live_ integration credential.
    adminCookie:
      type: apiKey
      in: cookie
      name: geolive_admin_session

  parameters:
    AccountId:
      in: path
      name: accountId
      required: true
      schema: { type: string, format: uuid }
    PlanId:
      in: path
      name: planId
      required: true
      schema: { type: string, format: uuid }
    InvoiceId:
      in: path
      name: invoiceId
      required: true
      schema: { type: string, format: uuid }
    SupportCaseId:
      in: path
      name: caseId
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }
    KeyId:
      in: path
      name: keyId
      required: true
      schema: { type: string, format: uuid }
    CsrfHeader:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
    PackageHeader:
      in: header
      name: X-GeoLive-Package
      required: false
      description: Required when the integration key defines allowed package IDs. Defense-in-depth until attestation.
      schema: { type: string }
    RequestTimestampHeader:
      in: header
      name: X-GeoLive-Request-Timestamp
      required: false
      description: Required for rgl_client_ location writes. Unix epoch milliseconds used for freshness checks.
      schema: { type: string, pattern: "^[0-9]+$" }
    RequestNonceHeader:
      in: header
      name: X-GeoLive-Request-Nonce
      required: false
      description: Required for rgl_client_ location writes; one-time URL-safe request nonce.
      schema: { type: string, minLength: 16, maxLength: 128 }
    RequestSignatureHeader:
      in: header
      name: X-GeoLive-Request-Signature
      required: false
      description: Base64url SHA256withECDSA P-256 signature when the short-lived token is proof-bound.
      schema: { type: string }

  schemas:
    PlanInput:
      type: object
      additionalProperties: false
      properties:
        code: { type: string, minLength: 2, maxLength: 63 }
        name: { type: string, minLength: 2, maxLength: 120 }
        status: { type: string, enum: [active, archived] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        monthlyPriceMinor: { type: integer, minimum: 0 }
        includedIngest: { type: integer, minimum: 0 }
        includedRead: { type: integer, minimum: 0 }
        includedTrackedUsers: { type: integer, minimum: 0 }
        maxProjects: { type: integer, minimum: 1, maximum: 1000000 }
        overageIngestPer1000Minor: { type: integer, minimum: 0 }
        overageReadPer1000Minor: { type: integer, minimum: 0 }
        overageTrackedUserMinor: { type: integer, minimum: 0 }
        features:
          type: object
          additionalProperties: { type: boolean }

    SubscriptionPatch:
      type: object
      additionalProperties: false
      properties:
        planId: { type: string, format: uuid }
        status:
          type: string
          enum: [trialing, active, past_due, canceled]
        provider: { type: string, maxLength: 240 }
        providerCustomerRef: { type: [string, "null"], maxLength: 240 }
        providerSubscriptionRef: { type: [string, "null"], maxLength: 240 }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        cancelAtPeriodEnd: { type: boolean }

    EntitlementOverrides:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Null removes an account override and restores inheritance from the plan.
      properties:
        maxProjects:
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: "null" }
        includedIngest:
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: "null" }
        includedRead:
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: "null" }
        includedTrackedUsers:
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: "null" }
        realtime: { type: [boolean, "null"] }
        movementHistory: { type: [boolean, "null"] }
        heatmap: { type: [boolean, "null"] }
        clientTokens: { type: [boolean, "null"] }
        androidAttestation: { type: [boolean, "null"] }
        prioritySupport: { type: [boolean, "null"] }

    SupportCaseCreate:
      type: object
      required: [subject, body]
      additionalProperties: false
      properties:
        subject: { type: string, minLength: 3, maxLength: 180 }
        body: { type: string, minLength: 3, maxLength: 10000 }
        projectId: { type: [string, "null"], format: uuid }
        category:
          type: string
          enum: [billing, technical, account, security, other]
        priority:
          type: string
          enum: [low, normal, high, urgent]

    SupportCasePatch:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [open, pending_customer, pending_internal, resolved, closed]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        assignedPlatformUserId: { type: [string, "null"], format: uuid }

    SupportMessage:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }

    PlatformSupportMessage:
      type: object
      required: [body]
      additionalProperties: false
      properties:
        body: { type: string, minLength: 1, maxLength: 10000 }
        internal: { type: boolean, default: false }

    InvoiceGenerate:
      type: object
      required: [periodStart, periodEnd]
      additionalProperties: false
      properties:
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        dueAt: { type: [string, "null"], format: date-time }
        taxMinor: { type: integer, minimum: 0 }
        notes: { type: [string, "null"], maxLength: 2000 }

    InvoicePatch:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [draft, open, paid, void, uncollectible]

    ClientTokenExchange:
      type: object
      required: [userId, platform, clientNonce, clientTimestampMs]
      additionalProperties: false
      properties:
        userId: { type: string, minLength: 1, maxLength: 160 }
        platform:
          type: string
          enum: [android, flutter, web, ios, server]
        packageId: { type: string, maxLength: 200 }
        clientNonce: { type: string, minLength: 16, maxLength: 128 }
        clientTimestampMs: { type: integer, minimum: 1 }
        proofPublicKey:
          type: string
          description: Base64url DER SubjectPublicKeyInfo for an EC P-256 public key.
        attestation:
          type: object
          required: [provider, token]
          additionalProperties: false
          properties:
            provider:
              type: string
              enum: [google-play-integrity]
            token:
              type: string
              maxLength: 25000

    ClientSecurityPolicyPatch:
      type: object
      additionalProperties: false
      properties:
        clientTokenTtlSeconds: { type: integer, minimum: 60, maximum: 3600 }
        requestMaxAgeSeconds: { type: integer, minimum: 30, maximum: 600 }
        tokenExchangeRequestsPerMinute: { type: integer, minimum: 1, maximum: 100000 }
        requireRequestProof: { type: boolean }
        androidAttestationMode:
          type: string
          enum: [off, optional, required]

    ProjectLimitsPatch:
      type: object
      additionalProperties: false
      properties:
        ingestRequestsPerMinute: { type: integer, minimum: 1, maximum: 1000000 }
        readRequestsPerMinute: { type: integer, minimum: 1, maximum: 1000000 }
        dailyIngestQuota: { type: integer, minimum: 1, maximum: 1000000000 }
        maxLiveUsers: { type: integer, minimum: 1, maximum: 10000000 }
        historyRetentionDays: { type: integer, minimum: 1, maximum: 3650 }
        securityEventRetentionDays: { type: integer, minimum: 7, maximum: 3650 }
        metricsRetentionDays: { type: integer, minimum: 7, maximum: 3650 }
        realtimeEventRetentionHours: { type: integer, minimum: 1, maximum: 720 }

    CreateApiKey:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [location:write, users:read, history:read, summary:read, events:read, tokens:issue]
        allowedOrigins:
          type: array
          maxItems: 50
          items: { type: string, format: uri }
        allowedPackages:
          type: array
          maxItems: 50
          items: { type: string }
        expiresAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: "null" }

    LocationObservation:
      type: object
      required: [userId, latitude, longitude]
      additionalProperties: false
      properties:
        userId: { type: string, maxLength: 160 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracyM: { type: number, minimum: 0 }
        altitudeM: { type: number }
        headingDeg: { type: number, minimum: 0, maximum: 360 }
        speedMps: { type: number, minimum: 0 }
        capturedAt: { type: string, format: date-time }
        name: { type: string }
        email: { type: string }
        country: { type: string }
        state: { type: string }
        city: { type: string }
        device: { type: object }
        metadata: { type: object }
