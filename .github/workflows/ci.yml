name: GeoLive CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: geolive-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Keep the full suite in one hosted job. GitHub bills private-repo
    # hosted-runner jobs per job/minute, so this avoids paying the
    # one-minute minimum twice while preserving the same coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: geolive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d geolive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: npm ci --ignore-scripts

      - name: Flutter SDK analysis
        run: dart analyze sdk/flutter/rekixo_geolive.dart

      # DATABASE_URL is deliberately absent here so npm test keeps
      # database-backed tests skipped until migrations are applied.
      - name: Static and memory verification
        run: npm run check

      - name: Apply PostgreSQL migrations
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/geolive
          DATABASE_SSL: disable
          NODE_ENV: test

      - name: PostgreSQL integration tests
        run: npm run test:postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/geolive
          DATABASE_SSL: disable
          NODE_ENV: test

      - name: Redis realtime integration
        run: node --test server/test/realtime-redis.test.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/geolive
          DATABASE_SSL: disable
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379

      - name: Retention worker smoke test
        run: npm run retention
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/geolive
          DATABASE_SSL: disable
          NODE_ENV: test

      - name: Billing rollup smoke test
        run: npm run billing:rollup -- current
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/geolive
          DATABASE_SSL: disable
          NODE_ENV: test
